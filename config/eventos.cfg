; Eventos de caos de la ruta (DISEÑO.md, secciones 7.1 y 7.3; etapa 5). Cada evento tiene
; inicio y fin y se anuncia con un letrero y un pitido antes de que pase.
; Para pruebas: activo=false apaga ese evento por completo.
; peso: qué tan seguido sale comparado con los demás.

[general]

; Eventos en cada tramo entre dos paradas: [mínimo, máximo]. El mínimo es 1 (criterio de la etapa 5).
por_tramo=[1, 2]
; Metros antes del evento en los que se avisa.
aviso=45.0
; Distancia mínima (m) entre un evento y una parada.
lejos_de_parada=22.0

[topes]

activo=true
peso=1.0
; Cuántos topes seguidos y cada cuántos metros.
cantidad=4
separacion=7.0

[bache_gigante]

activo=true
peso=1.0
; Largo del bache (m); ocupa los dos carriles.
largo=5.0
; Velocidad (km/h) a la que lo toma el chofer automático (frena solo, D3).
velocidad_chofer=25.0

[animales]

activo=true
peso=1.0
; Velocidad (m/s) con la que cruzan la calle.
rapidez=1.3

[bloqueo]

activo=true
peso=0.8
; Segundos que el chofer automático espera frente al bloqueo antes de que lo quiten.
espera=6.0

[lluvia]

activo=true
peso=0.8
; Metros de calle mojada.
largo=140.0
; Agarre de las llantas con la calle mojada (1 = normal).
agarre=0.6

[inspector]

activo=true
peso=0.8
; Multa por cada pasajero a bordo que no ha pagado cuando revisa.
multa_por_pasajero=12
; Segundos después de llegar a la parada en los que revisa.
retraso=3.0

[carrerita]

activo=true
peso=1.0
; Largo mínimo del tramo (m) para que quepa una carrerita.
tramo_minimo=110.0
; Qué tan rápido va el rival comparado con el chofer en modo loco.
factor_rival=1.2
; Metros detrás del camión donde aparece el rival.
aparece_atras=35.0
; Segundos que el rival se queda en la parada que te gana.
espera_rival=4.0

[prisa]

activo=true
peso=0.9
; Metros en los que el chofer maneja en modo loco.
largo=120.0

[robo]

; En una parada sube un ratero que va tras el morral del cobrador. Si se lo roba y se baja en la
; siguiente parada, el dinero se pierde; si lo tumban antes (un empujón, un frenazo), se le cae.
activo=true
peso=0.6
; Distancia (m) a la que alcanza a meterle la mano al morral.
alcance=0.9
