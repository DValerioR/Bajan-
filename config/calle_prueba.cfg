; Trazado de la calle de prueba de la etapa 1 (circuito cerrado).
; Se arma de piezas en orden, empezando en el origen hacia el frente:
;   ["recta", largo]            largo en metros
;   ["curva", radio, grados]    grados positivos = vuelta a la izquierda
; Para que el circuito cierre, los lados opuestos deben ser iguales.

[calle]

ancho_carril=3.6
alto_calle=0.25
ancho_banqueta=2.2
alto_banqueta=0.17
segmentos=[["recta", 40.0], ["curva", 20.0, 45.0], ["curva", 20.0, -45.0], ["recta", 40.0], ["curva", 30.0, 90.0], ["recta", 50.0], ["curva", 18.0, 90.0], ["recta", 40.0], ["curva", 20.0, 45.0], ["curva", 20.0, -45.0], ["recta", 40.0], ["curva", 30.0, 90.0], ["recta", 50.0], ["curva", 18.0, 90.0]]

[obstaculos]

; Topes: distancia en metros desde la salida, a lo ancho de toda la calle.
topes=[25.0, 180.0, 260.0, 330.0, 420.0]
; Altura con la que sobresale el tope sobre la calle (m) y su radio.
alto_tope=0.13
radio_tope=0.45
; Baches: [distancia, carril (0 = derecho, 1 = izquierdo), largo en metros].
baches=[[90.0, 0, 1.6], [93.0, 1, 1.3], [195.0, 0, 2.0], [290.0, 0, 1.4], [293.0, 1, 1.4], [435.0, 1, 1.8]]

[escenario]

; Semilla para que los edificios salgan siempre iguales.
semilla=7
separacion_edificios=11.0
