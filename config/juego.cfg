; Configuración de diseño de Bajan!
; Todos los números de diseño viven en archivos como este, nunca en los scripts.
; Se leen al arrancar desde el autoload Config (scripts/autoload/config.gd).

[jugadores]

; Máximo de jugadores humanos por partida. La v1 llega a 4 (DISEÑO.md, sección 1).
max_jugadores=4

[idioma]

; Idioma con el que arranca el juego si el jugador no ha elegido uno.
predeterminado="es"
; Idiomas disponibles, en el orden en que se recorren al cambiar.
disponibles=["es", "en"]
