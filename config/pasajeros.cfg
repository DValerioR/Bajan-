; Pasajeros no jugables (DISEÑO.md, secciones 6.0 y 7.5; etapa 3).
; Se recarga en vivo con F9 (los cambios aplican a los pasajeros que aparezcan después).

[pasajeros]

; Cuántos pasajeros caben a bordo (el criterio de la etapa 3 es aguantar 15).
capacidad=15
; Cuántos pueden esperar como máximo en cada parada, y cuántos hay en total en la calle y el camión.
max_esperando_por_parada=4
max_total=30
; Al empezar, cuántos esperan en cada parada: [mínimo, máximo].
esperando_al_inicio=[1, 3]
; Cada cuántos segundos llega gente nueva a las paradas, y con qué probabilidad en cada una.
intervalo_llegadas=12.0
probabilidad_llegada=0.5
; A cuántas paradas de distancia se baja cada quien: [mínimo, máximo].
paradas_de_viaje=[1, 3]
; Segundos entre un pasajero y el siguiente al subir o bajar por la puerta.
separacion_puerta=0.6
; Velocidad al caminar (fracción de la del jugador) y segundos antes de desaparecer al irse.
rapidez=0.8
tiempo_para_desaparecer=4.0
; Modelos de modelos/personajes/ que pueden salir como pasajeros.
modelos=["abuelita", "galan", "chavo_sudadera", "fresa", "albanil", "senora", "oficinista", "luchador", "abuelo_vaquero", "nino", "punk", "turista", "gotica", "senor"]

[orilla]

; Gente a medio camino (D55): hace la parada en la banqueta entre paradas y solo sube si el voceador,
; colgado de la puerta, la jala al pasar. Cada cuántos segundos puede aparecer alguien y con qué
; probabilidad, cuántos a la vez como máximo, a cuántos metros adelante del camión aparecen
; [mínimo, máximo], a cuántos metros de una parada no, y qué tan adentro de la banqueta (m).
intervalo=10.0
probabilidad=0.6
maximo=3
distancia=[70.0, 130.0]
lejos_de_parada=30.0
lateral=0.9
