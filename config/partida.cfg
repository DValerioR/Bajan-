; Dinero, cuota, cobro y ventana de parada (DISEÑO.md, sección 6; etapa 4).
; Se recarga en vivo con F9.

[dinero]

; Lo que paga cada pasajero.
pasaje=12
; Penalización por reaparecer (cuando alguien sale volando o se queda en tierra).
penalizacion_reaparecer=20
; Caja chica con la que empieza la primera ruta (D15: cuatro veces la penalización de reaparecer).
caja_chica=80
; Bonificación al empezar cada ruta siguiente, como fracción de la caja chica.
bonificacion=0.5
; Cuota de la primera ruta y cuánto sube en cada ruta siguiente.
cuota_inicial=60
cuota_por_ruta=30

[cobro]

; Distancia a la que el cobrador alcanza a cobrarle a un pasajero (m).
alcance=1.6
; Fracción de lo que trae en el morral que se le riega al tropezar (al caer como ragdoll se le riega todo).
derrame_tropiezo=0.3
; Valor de cada moneda que cae al piso, y máximo de monedas que caen de una vez.
valor_moneda=2
max_monedas=12
; Distancia a la que se recoge una moneda al pasar caminando (m).
alcance_moneda=0.7
; Segundos que tarda en desaparecer una moneda que cayó a la calle.
vida_moneda_en_calle=3.0
; Qué tan fuerte salen volando las monedas al regarse (m/s, hacia los lados).
velocidad_regado=1.2

[parada]

; Duración de la ventana de parada (s, D20).
ventana=10.0
; Pasado el tiempo, cuánto se desesperan los pasajeros por segundo (0 a 1): pagan menos...
desesperacion_por_segundo=0.08
; ...y probabilidad por segundo de que uno de los que van a bordo se baje enojado (sin pagar).
probabilidad_bajarse=0.15
