; Tramos prediseñados con los que GeneradorRuta arma cada ruta (DISEÑO.md, sección 4).
; Cada tramo: zona, trazado (como en calle_prueba.cfg), topes y baches (distancias desde el
; inicio del tramo; baches: [distancia, carril, largo]), dónde va su parada (-1 = sin parada)
; y su dificultad (1 = tranquilo, 3 = feo). El generador puede voltear las curvas en espejo.
; Las paradas van en tramos rectos y lejos de topes y baches.

[generador]

; Paradas por ruta: [mínimo, máximo] (entre 6 y 10 al principio).
paradas=[6, 10]
; Recta de salida y de llegada (m).
recta_salida=30.0
recta_llegada=35.0
; Rumbo máximo respecto al de salida (grados): así la ruta nunca se enrosca sobre sí misma.
rumbo_maximo=70.0

[popular_tranquila]
zona="popular"
segmentos=[["recta", 40.0], ["curva", 40.0, 25.0], ["recta", 30.0]]
topes=[10.0]
baches=[[55.0, 1, 1.4]]
parada=28.0
dificultad=1

