; Caminar dentro del camión en movimiento (DISEÑO.md, sección 7.2, etapa 2).
; Se recarga en vivo con F9.

[jugador]

; Velocidad al caminar (m/s) y qué tan rápido llega a ella. "firmeza" es qué tanto resiste
; el personaje los empujones: con firmeza 4 y un empujón de 3 m/s², te arrastra a 0.75 m/s.
velocidad=3.0
firmeza=4.0
; Control en el aire (fracción) y fuerza del salto (m/s).
control_aire=0.15
salto=3.6
; Velocidad máxima que puede alcanzar respecto al camión (m/s), para que nadie salga disparado por un error.
velocidad_maxima=7.0
; Radio de la cápsula de colisión (m). La altura sale del modelo del personaje.
radio=0.27
; Distancia máxima (m, en el piso) a un asiento libre para sentarse en él (tecla C).
alcance_asiento=1.2
; Personaje que usa el jugador en la prueba (nombre de modelos/personajes/).
modelo="cobrador"

[inercia]

; Exageración de los empujones del camión (1 = física real).
exageracion=1.3
; Tope del empujón horizontal (m/s²), para que se vea caótico pero no injugable.
empujon_maximo=9.0
; Tope de lo que el camión puede "levantar" o "aplastar" a la gente en un tope o un bache (m/s²).
vertical_maximo=8.0
; Suavizado de las aceleraciones del camión (s), para que un golpe de un solo cuadro no lance a nadie.
suavizado=0.06
; Empujón (m/s²) a partir del cual el personaje tropieza si no va sujeto, y cuánto dura el tropiezo (s).
umbral_tropiezo=8.0
duracion_tropiezo=1.1
; Qué fracción del empujón siente quien va sujeto del pasamanos.
factor_sujetado=0.15
; Distancia máxima a un pasamanos o poste para poder sujetarse (m).
alcance_pasamanos=1.0

[ragdoll]

; Cuántos personajes pueden andar hechos ragdoll al mismo tiempo (D4). Si ya hay tantos,
; el que reciba un golpe solo tropieza.
max_activos=6
; Empujón del camión (m/s²) que tumba como ragdoll a quien va de pie sin sujetarse.
; Más bajo que empujon_maximo para que los frenazos fuertes sí tumben.
umbral_empujon=8.8
; Golpe directo (cambio de velocidad en m/s: un empujón, algo que le cae encima) que lo tumba.
umbral_golpe=4.0
; Cuánto tiempo se queda tirado (s): mínimo, y máximo aunque se siga moviendo.
tiempo_minimo=1.6
tiempo_maximo=6.0
; Masa total del muñeco (kg) para un personaje de 1.7 m; escala con la altura.
masa=60.0
; Cuánto se doblan las articulaciones (grados): en cono y girando sobre sí mismas.
columpio=70.0
giro=25.0

[objetos]

; Distancia para agarrar objetos (m), fuerza para lanzarlos (m/s) y del empujón con la mano (m/s).
alcance=2.2
velocidad_lanzamiento=9.0
empujon=5.0
; Exageración de los empujones del camión sobre los objetos sueltos.
exageracion=1.3

[piloto]

; Piloto automático de prueba: [velocidad km/h, aceleración en curvas m/s², segundos entre sustos].
; Un "susto" es un frenazo o acelerón de golpe; 0 = nunca.
tranquilo=[30.0, 3.0, 0.0]
normal=[45.0, 4.5, 9.0]
loco=[65.0, 6.5, 4.0]
; Cuánto espera en cada parada (s) y con qué desaceleración llega a ella (m/s²).
espera_parada=8.0
; Si todavía hay gente subiendo o bajando, espera hasta estos segundos más.
espera_extra_parada=8.0
frenado_parada=3.0
; Manejo malo a propósito (D3): hasta cuántos metros se pasa de la parada y cuánto abre las
; curvas (m hacia afuera en las más cerradas).
sobrepaso_parada=1.5
curvas_abiertas=0.8
; Desaceleración (m/s²) con la que frena ante un obstáculo (animales, bloqueo, el rival).
frenado_obstaculo=5.0
