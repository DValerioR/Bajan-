; Roles y bots del interior (DISEÑO.md, secciones 5.1, 5.2 y 10.1; etapa 6A).
; Se recarga en vivo con F9.

[voceador]

; Aliento (0 a 100): cuánto gasta por segundo al gritar y cuánto recupera sin gritar.
gasto_aliento=22.0
recupera_aliento=14.0
; Con menos aliento que esto no le sale el grito (y tiene que esperar a juntar un poco).
aliento_minimo=15.0
; Distancia (m) antes de una parada a la que ya se oye el grito.
alcance_grito=40.0
; Segundos de grito que juntan a un pasajero más en la parada, y cuántos de más como máximo.
segundos_por_pasajero=1.6
max_atraidos_por_parada=4
; Distancia (m) a la puerta a la que puede jalar a un pasajero para que suba.
alcance_ayuda=2.5

[vendedor]

; Dulces que caben en la caja y propina por cada venta: [mínimo, máximo].
mercancia=10
propina=[3, 6]
; Probabilidad de que un pasajero quiera dulce (a cada pasajero se le ofrece una vez).
probabilidad_compra=0.6
; Distancia a la que alcanza a venderle a un pasajero (m).
alcance=1.6
; Dulces que se le caen al tropezar y al caer como ragdoll.
perdida_tropiezo=1
perdida_caida=3
; Cada cuántas paradas hay un puesto de dulces para reabastecer (el primero, en la parada 3).
puesto_cada=3
; Distancia al puesto para reabastecer (m).
alcance_puesto=1.8

[bots]

; Rapidez al caminar (fracción de la del jugador): peor desempeño que un humano.
rapidez=0.75
; Segundos que tarda en reaccionar (sujetarse ante un frenazo, cobrar, vender).
reaccion=0.45
; Empujón del camión (m/s²) a partir del cual quiere sujetarse.
umbral_sujetarse=3.5
; Probabilidad de que no alcance a sujetarse cuando lo necesita.
probabilidad_fallar=0.25
; Bot vendedor: probabilidad de que suba en una parada (si no viene a bordo) y cuántas paradas se queda.
vendedor_sube=0.5
vendedor_paradas=[2, 3]
