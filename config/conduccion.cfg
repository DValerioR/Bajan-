; Parámetros de conducción del camión (DISEÑO.md, sección 7.1).
; Se pueden cambiar con el juego abierto: guarda este archivo y presiona F9 para recargarlo.
; Las fuerzas se expresan como aceleraciones (m/s²) para que no dependan de la masa.

[camion]

; Masa en kg. Casi no cambia el manejo porque las fuerzas escalan con ella.
masa=3500.0
; Altura del centro de masa respecto al chasis (m). Más negativo = más difícil de voltear.
centro_masa_y=-0.45
; Freno al giro del camión sobre sí mismo. Más alto = gira y se balancea menos.
amortiguacion_angular=0.6

[suspension]

; Largo de la suspensión en reposo (m) y radio de las llantas (m).
largo_reposo=0.55
radio_rueda=0.45
; Dureza del resorte de cada llanta (m/s² por metro de compresión). Más bajo = más rebote.
rigidez=34.0
; Amortiguación del resorte. Más bajo = rebota más tiempo (más caricaturesco).
amortiguacion=4.0
; Patada al pegarle a un tope o a la orilla de un bache: qué fracción de la velocidad con que
; sube la llanta se le pasa a esa esquina del camión. 0 = suspensión perfecta (no brinca);
; 1 = como si no tuviera suspensión. Solo actúa si la llanta sube más rápido que umbral_patada (m/s),
; y nunca empuja más rápido que patada_maxima (m/s).
patada_topes=0.45
umbral_patada=1.0
patada_maxima=2.5

[motor]

; Aceleración hacia adelante (m/s²) y velocidad máxima (km/h).
aceleracion=6.0
velocidad_maxima_kmh=80.0
; Reversa: aceleración (m/s²) y velocidad máxima (km/h).
aceleracion_reversa=3.5
velocidad_maxima_reversa_kmh=18.0

[frenos]

; Desaceleración al frenar a fondo (m/s²).
frenado=12.0
; Freno natural de las llantas y del aire cuando no aceleras.
resistencia_rodado=0.04
resistencia_aire=0.0009

[direccion]

; Ángulo máximo de las llantas delanteras (grados) parado y a velocidad máxima.
angulo_maximo=36.0
angulo_a_velocidad_maxima=8.0
; Qué tan rápido gira el volante hacia donde lo pides y qué tan rápido regresa al centro (vueltas completas por segundo).
rapidez_volante=2.4
retorno_volante=3.5

[agarre]

; Qué tan rápido las llantas eliminan el derrape lateral (1/s). Más alto = se pega más al piso.
lateral_delantero=7.0
lateral_trasero=5.5
; Límite de agarre lateral como fracción del peso sobre cada llanta. Más bajo = derrapa más.
coeficiente_maximo=0.95
; Dónde se aplican las fuerzas de las llantas: 0 = en el piso (se ladea más), 1 = en el centro de masa (no se ladea).
altura_fuerzas=0.6

[estabilidad]

; Fuerza que endereza al camión cuando se inclina más del límite o va en el aire.
enderezar_fuerza=5.0
; Inclinación (grados) a partir de la cual empieza a enderezarse solo.
inclinacion_limite=25.0

[visual]

; Balanceo exagerado de la carrocería (solo visual, no afecta la física).
; Grados por cada m/s² de aceleración lateral y de frenado/arranque.
inclinacion_lateral_factor=1.1
inclinacion_lateral_max=8.0
cabeceo_factor=0.8
cabeceo_max=6.0
; El balanceo solo se ve a velocidades altas (las cámaras van dentro de la carrocería y se ladea toda
; la pantalla): nada abajo de balanceo_desde_kmh, completo desde balanceo_pleno_kmh.
balanceo_desde_kmh=50.0
balanceo_pleno_kmh=70.0
; Qué tan rápido sigue la carrocería al balanceo (más alto = más nervioso).
suavizado=5.0

[camara]

; Sensibilidad del ratón (grados por pixel) y del stick derecho (grados por segundo).
sensibilidad_raton=0.12
sensibilidad_mando=140.0
; Hasta dónde puede voltear la cabeza el chofer (grados).
limite_horizontal=110.0
limite_vertical=60.0

[sonido]

; Volumen del motor y del claxon (dB).
volumen_motor=-14.0
volumen_claxon=-6.0
