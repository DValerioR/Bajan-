; Cómo se procesan los modelos originales de Tripo (modelos/fuentes/, fuera de git) en
; personajes de muñeco por piezas (modelos/personajes/<nombre>.glb). Se corre con
; procesar_personajes.bat; los .glb que ya existen no se tocan (usa --forzar para regenerarlos).
; Cada hoja trae varios personajes; se nombran por fila (arriba primero), de izquierda a derecha.

[general]

; Metros por unidad del modelo original: con 3.8 un adulto típico mide entre 1.5 y 1.9 m.
escala=3.8
; Triángulos aproximados por personaje después de reducirlo (todas sus piezas juntas).
triangulos_por_personaje=6000
; Lado (pixeles) de la textura de cada personaje. Con Blender, cada personaje lleva su propia
; textura con solo sus pedazos; sin Blender es el lado máximo del recorte de la hoja original.
tamano_textura=2048

[Modelos1]

archivo="res://modelos/fuentes/Modelos1.glb"
nombres=["", "cobrador", "voceador", "vendedora", "", "galan", "chavo_sudadera"]

[Modelos2]

archivo="res://modelos/fuentes/Modelos2.glb"
nombres=["", "albanil", "senora", "oficinista", "luchador", "abuelo_vaquero", "nino", "punk", "turista"]

; Hojas de un solo personaje (un modelo suelto de Tripo): se toma completo y se escala a su estatura.
; Los nombres vacíos ("") son personajes viejos que ya no se generan: el chofer y la abuelita en
; Modelos1 y la fresa en Modelos2 (se cambiaron por modelos sueltos).

[Fresa]

; La fresa nueva (20/10/2026), suelta y en pose T. El original de Tripo (1.9 millones de caras,
; textura de 8K) se aligeró con Blender a 200 000 caras y textura de 4K antes de guardarlo aquí.
archivo="res://modelos/fuentes/fresa.glb"
nombres=["fresa"]
altura=1.78

[Gotica]

; Modelos sueltos en pose T (20/10/2026), aligerados con Blender como la fresa.
archivo="res://modelos/fuentes/gotica.glb"
nombres=["gotica"]
altura=1.60
; Piernas muy delgadas (medias a rayas): con 6000 triángulos la reducción se las comía.
triangulos_por_personaje=16000

[Ladron]

; Solo sale en el evento de robo (no es pasajero).
archivo="res://modelos/fuentes/ladron.glb"
nombres=["ladron"]
altura=1.70

[Chofer]

archivo="res://modelos/fuentes/chofer.glb"
nombres=["chofer"]
; Estatura en metros (en lugar de la escala general).
altura=1.72
tamano_textura=2048
; Sin reducir: el modelo ya viene ligero y reducirlo mancha la textura en las costuras.
triangulos_por_personaje=0

; Modelos que Tripo ya entrega con esqueleto (rig estilo Mixamo, en FBX): `rig` en lugar de
; `archivo`. No se cortan en piezas: rig_tripo_blender.py conserva sus pesos (D53).

[Senor]

; Un señor de camisa a rayas (21/10/2026), suelto, en pose T y con rig; textura de 4K.
rig="res://modelos/fuentes/senor/senor.fbx"
nombres=["senor"]
altura=1.66
brazos_caidos=16

[AbuelitaRig]

; La abuelita nueva (21/10/2026), con rig y cuatro animaciones (de ahí salen las del juego, D53);
; reemplaza a la de Modelos1.
rig="res://modelos/fuentes/abuelita/abuelita.fbx"
nombres=["abuelita"]
altura=1.2
brazos_caidos=14

; Articulaciones medidas a mano en la vista de frente, como fracción de la altura del personaje
; (0 = pies, 1 = punta de la cabeza). Si un personaje no tiene sección, se estiman solas.
;   cuello: donde se separa la cabeza   axila: debajo del brazo   entrepierna: donde se separan las piernas
;   mano_x, mano_y: punta de los dedos (x medida desde el centro)   hombro_x: ancho del hombro desde el centro
;   brazos_caidos: solo para modelos en pose T; los brazos se bajan hasta quedar abiertos esos grados
;   cara_x: medio ancho de la cara justo arriba del cuello. Solo para los de hombros altos: lo que
;           queda más afuera, a esa altura, es hombro y se queda en el torso (no se mueve con la cabeza)
;   nuca_z: dónde está la nuca, de lado (negativo = hacia el frente). Para los encorvados o de espalda
;           alta: lo que queda más atrás, justo arriba del cuello, es espalda
;   ojos, boca, cara_giro: cara animada (párpados y mandíbula), ver scripts/personajes/cara_personaje.gd
;   manga_con_brazo: true para mangas cortas y anchas: la manga se va con el brazo (si no, al
;           levantarlo queda una manga vacía colgando del hombro)

